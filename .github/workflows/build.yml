name: 打包桌面应用

# PyInstaller 不能交叉编译：Mac 上打的包 Windows 用不了，反之亦然。
# 这里在两个系统上各构建一次，产物可直接下载分发。

on:
  push:
    tags: ['v*']          # 打 tag 时自动构建并发布 Release
  workflow_dispatch:       # 也可以在 Actions 页面手动触发

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: macOS
            artifact: 邮件发票识别系统-macOS
          - os: windows-latest
            name: Windows
            artifact: 邮件发票识别系统-Windows

    runs-on: ${{ matrix.os }}
    name: 构建 ${{ matrix.name }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 跑解析回归测试
        run: python test_pdf_parser.py

      - name: 打包
        run: pyinstaller bill_app.spec

      - name: 压缩产物 (macOS)
        if: runner.os == 'macOS'
        run: |
          cd dist
          # 用 ditto 保留 .app 的包结构和权限位，zip 会破坏它
          ditto -c -k --sequesterRsrc --keepParent "邮件发票识别系统.app" "../${{ matrix.artifact }}.zip"

      - name: 压缩产物 (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path "dist/邮件发票识别系统.exe" -DestinationPath "${{ matrix.artifact }}.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.zip
          retention-days: 30

      - name: 发布到 Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.artifact }}.zip
          body: |
            双击即可运行，无需安装 Python。

            **首次打开提示"无法验证开发者"（未做代码签名）：**
            - macOS：右键点图标 → 打开 → 再点"打开"；或终端执行 `xattr -cr 邮件发票识别系统.app`
            - Windows：SmartScreen 弹窗 → 更多信息 → 仍要运行

            数据保存在程序同级目录的 `data/` 文件夹里，换电脑时请一并复制。
