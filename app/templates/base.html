<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="csrf-token" content="{{ csrf_token() }}">
    <title>{% block title %}邮件发票识别系统{% endblock %}</title>

    {# 全部静态资源走本地，断网或公司网络墙掉CDN时界面依然正常 #}
    <link href="{{ url_for('static', filename='vendor/bootstrap/bootstrap.min.css') }}" rel="stylesheet">
    <link href="{{ url_for('static', filename='vendor/fontawesome/css/all.min.css') }}" rel="stylesheet">
    <link href="{{ url_for('static', filename='vendor/datatables/dataTables.bootstrap5.min.css') }}" rel="stylesheet">
    <link href="{{ url_for('static', filename='css/main.css') }}" rel="stylesheet">

    {% block extra_css %}{% endblock %}
</head>
<body>
    {% set current_path = request.path %}
    <nav class="navbar navbar-expand-lg app-navbar">
        <div class="app-container w-100 d-flex align-items-center">
            <a class="navbar-brand me-4" href="/">
                <i class="fas fa-file-invoice"></i> 发票识别
            </a>
            <button class="navbar-toggler ms-auto" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link {{ 'active' if current_path == '/' }}" href="/">
                            <i class="fas fa-chart-line"></i>概览
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {{ 'active' if current_path.startswith('/upload') }}" href="/upload/">
                            <i class="fas fa-cloud-upload-alt"></i>上传识别
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {{ 'active' if current_path.startswith('/invoice') }}" href="/invoice/list">
                            <i class="fas fa-file-invoice-dollar"></i>发票
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {{ 'active' if current_path.startswith('/email') }}" href="/email/list">
                            <i class="fas fa-envelope"></i>邮件
                        </a>
                    </li>
                </ul>
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link {{ 'active' if current_path.startswith('/config') }}" href="/config">
                            <i class="fas fa-cog"></i>设置
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="app-container">
        {% block content %}{% endblock %}
    </main>

    <script src="{{ url_for('static', filename='vendor/jquery/jquery.min.js') }}"></script>
    <script src="{{ url_for('static', filename='vendor/bootstrap/bootstrap.bundle.min.js') }}"></script>
    <script src="{{ url_for('static', filename='vendor/datatables/jquery.dataTables.min.js') }}"></script>
    <script src="{{ url_for('static', filename='vendor/datatables/dataTables.bootstrap5.min.js') }}"></script>
    <script src="{{ url_for('static', filename='vendor/sweetalert2/sweetalert2.all.min.js') }}"></script>
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>

    {% block extra_js %}{% endblock %}
</body>
</html>
